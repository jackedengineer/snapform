name: Encrypted backup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encrypted-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify recovery, transfer, replay and cleanup behavior
        run: pnpm test:recovery
      - name: Export, encrypt, upload, verify remote bytes, replay and quarantine
        run: node scripts/backup-to-r2.mjs
        env:
          DATABASE_BACKUP_URL: ${{ secrets.DATABASE_BACKUP_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          CLOUDFLARE_ACCOUNT_ID: afc0353bdd89b39c334efd3db0311ec3
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_PURGE_ACCESS_KEY_ID: ${{ secrets.R2_PURGE_ACCESS_KEY_ID }}
          R2_PURGE_SECRET_ACCESS_KEY: ${{ secrets.R2_PURGE_SECRET_ACCESS_KEY }}
          PURGE_LEDGER_KEY: ${{ secrets.PURGE_LEDGER_KEY }}
# Enable the nightly trigger only after scoped credentials, real remote transfer,
# automated restore/replay and independent key custody have been verified.
