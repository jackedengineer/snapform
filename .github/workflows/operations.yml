name: Operations check
# Hourly, outside Cloudflare (docs/runbooks/alerts.md). Scheduled failures email
# whoever last changed the cron line.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      alert_drill:
        description: 'Fail on purpose after a healthy check, to test the failure email'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: operations-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: node scripts/check-operations.mjs
        env:
          SNAPFORM_ALERT_DRILL: ${{ inputs.alert_drill }}
