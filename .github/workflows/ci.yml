name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every run uses the same Neon database; preserve queued checks across branches.
    concurrency:
      group: snapform-shared-neon-verification
      queue: max
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.SNAPFORM_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure isolated local runtime (no live email)
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          for (const key of ['DATABASE_URL', 'BETTER_AUTH_SECRET']) {
            if (!process.env[key]) throw new Error(`Missing required CI secret: ${key}`);
          }
          const values = {
            DATABASE_URL: process.env.DATABASE_URL,
            BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET,
            BETTER_AUTH_URL: 'http://127.0.0.1:5173',
            RESEND_API_KEY: 'no-live-email-in-ci',
            EMAIL_FROM: 'Snapform <no-reply@jacked.dev>',
            AUTH_ALLOWED_RECIPIENT: 'runtime-check@example.invalid',
          };
          await writeFile('apps/api/.dev.vars', Object.entries(values).map(([key, value]) => `${key}=${JSON.stringify(value)}`).join('\n') + '\n', { mode: 0o600, flag: 'wx' });
          await writeFile('apps/jobs/.dev.vars', 'DATABASE_URL=""\nRESEND_WEBHOOK_SECRET="whsec_MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="\n', { mode: 0o600, flag: 'wx' });
          JS
      - run: pnpm types:generate
      - run: pnpm build
      - run: pnpm check:fast
      - run: pnpm test
      - run: pnpm test:preview
      - run: pnpm test:dev-reload
      - run: pnpm check:bundle
      - run: pnpm audit --prod --audit-level high
      - run: git diff --exit-code
